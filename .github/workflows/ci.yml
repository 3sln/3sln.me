name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run test:worker
      - run: npm run test:dom
      - run: npm run test:ui-state
      - run: npm run check:worker
      - name: Install headless browser
        run: npx playwright install --with-deps chromium
      - name: Wrangler browser verification
        run: node scripts/run-browser-checks.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
